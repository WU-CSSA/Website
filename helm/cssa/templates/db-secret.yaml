{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cssa.fullname" . }}-db-url
  labels:
    {{- include "cssa.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "cssa.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
