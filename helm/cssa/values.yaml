# Default values for cssa
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/wu-cssa/website
  pullPolicy: IfNotPresent
  tag: "latest"  # Use "latest" or a specific SHA/tag

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: cssa.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cssa-tls
      hosts:
        - cssa.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the application
env:
  NODE_ENV: production
  NEXTAUTH_URL: https://cssa.example.com

# Secrets - these should be provided via sealed-secrets or external-secrets
secrets:
  # Set to true to create a Secret resource from values below
  # For production, use external-secrets or sealed-secrets instead
  create: false
  # Values below are only used if secrets.create is true
  databaseUrl: ""
  nextauthSecret: ""
  githubClientId: ""
  githubClientSecret: ""

# External secret configuration (for external-secrets operator)
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

# PostgreSQL subchart configuration
postgresql:
  enabled: true  # Set to true to deploy PostgreSQL alongside the app
  image:
    tag: "17"  # Use major version tag for stability
  auth:
    postgresPassword: "changeme-postgres-admin"
    username: cssa
    password: "changeme-cssa-password"
    database: cssa
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  # Metrics for monitoring (optional)
  metrics:
    enabled: false

# Database migrations
migrations:
  enabled: true  # Run Prisma migrations on install/upgrade

# Health check configuration
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
